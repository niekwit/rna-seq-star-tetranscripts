$schema: "http://json-schema.org/draft-06/schema#"

description: Snakemake configuration file

type: object

properties:
  genome:
    type: string
    description: "Genome build to use for mapping and annotation"
    enum: ["mm39", "hg38", "hg19", "mm38", "T2T-CHM13v2.0"]
  ensembl_genome_build:
    type: string
    description: "Ensembl genome build version"
    default: 110
  strand:
    type: string
    description: "Strandness of the library"
    enum: ["forward", "reverse", "unstranded"]
    default: "reverse"
  fdr_cutoff:
    type: number
    description: "FDR cutoff for volcano plots"
    default: 0.05
  fc_cutoff:
    type: number
    description: "Log2 fold change cutoff for volcano plots"
    default: 0.5
  
  spike_in:
    type: object
    description: "Spike-in correction parameters"
    properties:
      apply:
        type: boolean
        description: "Whether to apply spike-in correction"
      name:
        type: string
        description: "Pattern for spike-in names"
      gtf:
        type: string
        description: "Path to the GTF file for spike-ins"
      fasta:
        type: string
        description: "Path to the FASTA file for spike-ins"

  mapping:
    type: object
    description: "STAR mapping parameters"
    properties:
      outFilterMultimapNmax:
        type: integer
        description: "Maximum number of multiple alignments allowed"
      winAnchorMultimapNmax:
        type: integer
        description: "Maximum number of multiple alignments allowed for chimeric reads"
      extra_params:
        type: string
        description: "Additional arguments to pass to STAR"
        default: ""

  telocal:
    type: object
    description: "TElocal locus-level TE quantification parameters"
    properties:
      apply:
        type: boolean
        description: "Whether to also run TElocal for locus-level TE quantification"
        default: false
      index_url:
        type: string
        description: "URL to a prebuilt TElocal locus index (.locInd, gzipped), matched to the `genome` build"
        default: ""
      locations_url:
        type: string
        description: "URL or local path to the TElocal locus locations file (.locations.gz) matching the index"
        default: ""
      extra_params:
        type: string
        description: "Additional arguments to pass to TElocal"
        default: ""
  
  deeptools:
    type: object
    description: "DeepTools parameters"
    properties:
      normalisation:
        type: string
        description: "Normalisation method for DeepTools"
        enum: ["RPKM", "FPKM", "TPM"]
        default: "RPKM"
      binsize:
        type: integer
        description: "Bin size for DeepTools"
        default: 10
  
  resources:
    type: object
    description: "Computing resources for different steps"
    properties:
      trim:
        type: object
        properties:
          cpu:
            type: integer
            description: "Number of CPUs to use"
            default: 8
          time:
            type: integer
            description: "Time in minutes"
            default: 60
      fastqc:
        type: object
        properties:
          cpu:
            type: integer
            description: "Number of CPUs to use"
            default: 4
          time:
            type: integer
            description: "Time in minutes"
            default: